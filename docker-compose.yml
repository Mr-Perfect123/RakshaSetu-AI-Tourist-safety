version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: rakshasetu_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-rakshasetu_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/rakshasetu_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshasetu_backend
    restart: always
    environment:
      PORT: 5005
      NODE_ENV: production
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: rakshasetu_db
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "5005:5005"
    depends_on:
      database:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: rakshasetu_admin
    restart: always
    ports:
      - "5173:80"

  tourist-app:
    build:
      context: ./backend/frontend
      dockerfile: Dockerfile
    container_name: rakshasetu_tourist
    restart: always
    ports:
      - "3000:80"

volumes:
  mysql_data:
