services:
  - type: web
    name: rakshasetu-api
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5005
      - key: DB_HOST
        fromDatabase:
          name: rakshasetu-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: rakshasetu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rakshasetu-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: rakshasetu-db
          property: database

  - type: static
    name: rakshasetu-admin
    buildCommand: cd admin-dashboard && npm install && npm run build
    staticPublishPath: admin-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: static
    name: rakshasetu-tourist
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rakshasetu-db
    databaseName: rakshasetu_db
    user: rakshasetu_user
